# Hot-reload dev setup:  docker compose -f docker-compose.dev.yml up --build
# Edit files on your machine; both servers reload inside the containers.
services:
  backend:
    build: ./backend
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload
    ports:
      - "8000:8000"
    volumes:
      - ./backend/main.py:/app/main.py   # bind mount: live code edits
      - todo-data-dev:/data

  frontend:
    image: node:20-alpine
    working_dir: /app
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    environment:
      API_URL: http://backend:8000
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules   # keep container's node_modules, not the host's
    depends_on:
      - backend

volumes:
  todo-data-dev:
